<ActionBar title="Szczegóły produktu"></ActionBar>

<StackLayout class="p-4">

    <Label *ngIf="loading" text="Ładowanie..." class="text-center mt-4"></Label>

    <Label *ngIf="error && !loading"
           [text]="error"
           class="text-red-500 text-center"></Label>

    <StackLayout *ngIf="product && !loading">

        <Image [src]="product.thumbnail"
               stretch="aspectFit"
               height="200"
               class="mb-4"></Image>

        <Label [text]="product.title"
               class="font-bold text-xl mb-2"></Label>

        <Label [text]="product.description"
               class="text-base mb-2"></Label>

        <Label [text]="'Cena: ' + product.price + ' USD'"
               class="text-lg text-green-600"></Label>

    </StackLayout>

</StackLayout>
